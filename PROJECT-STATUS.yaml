schema_version: "1.0"
project:
  name: ERC-8004-CSP
  maturity: implementation-draft
  lifecycle: active
  operational_status: active-development
  specification_status: working-draft
  intended_use:
    - erc-8004-assurance-profile-development
    - ecosystem-specific-conformance-guidance
    - implementation-analysis
  not_asserted:
    - upstream-erc-authority
    - production-certification
    - independent-third-party-assurance
authority:
  normative_scope:
    - erc-8004-assurance-profile
  does_not_own:
    - upstream-erc-8004-specification
    - ethereum-governance
    - external-deployment-policy
  delegation: "Repository maintainers govern the CSP profile and fork-local assurance guidance; upstream ERC and ecosystem authorities retain their own authority."
  revocation_or_supersession: "Profile requirements are superseded through explicit versioned repository changes with prior states retained in Git history."
evidence:
  validation_commands:
    - git diff --check
    - CSP_OPA_BIN=/path/to/verified/opa python -m unittest discover -s tests -v
  evidence_outputs:
    - GitHub Actions rego-conformance workflow run results
    - GitHub Actions Pages source-pin, traceability, and link-check results
    - author-supplied normalized-evidence red-team regression report (synthetic only)
  known_limitations:
    - repository-specific automated conformance coverage is not asserted by this declaration
    - upstream ERC-8004 authority is explicitly outside scope
    - Rego evaluator uses synthetic data and externally supplied normalization and verification claims
    - action authorization and independent third-party assurance are not provided
    - red-team source recognition, chain finality, secure fetch, validator independence, and economic enforcement require external implementation evidence
    - prose T01-T47 scenarios are not fully executed consumer conformance tests
    - v0.10.0 specification and policy contracts remain unreleased candidates
