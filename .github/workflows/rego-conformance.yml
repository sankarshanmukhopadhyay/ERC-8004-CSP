name: CSP Rego decision conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rego-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install JSON Schema validator
        run: python -m pip install 'jsonschema==4.23.0'
      - name: Fetch checksum-pinned OPA v1.9.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/opa \
            https://github.com/open-policy-agent/opa/releases/download/v1.9.0/opa_linux_amd64_static
          echo '66fa66f3b730b2fb086003863428b382b2898d343adb4b5dfab5598b4d739eed  /tmp/opa' | sha256sum --check
          chmod +x /tmp/opa
          /tmp/opa version
      - name: Check Rego modules
        run: |
          /tmp/opa check --strict policy/rego/validation.rego
          /tmp/opa check --strict conformance/rego/defective.rego
      - name: Run schema and real-engine conformance
        env:
          CSP_OPA_BIN: /tmp/opa
        run: python -m unittest discover -s tests -p 'test_rego_policy.py' -v
      - name: Exercise canonical consumer CLI
        run: |
          python scripts/evaluate_validation.py \
            --opa /tmp/opa \
            --input conformance/rego/admissible.json \
            --output /tmp/csp-result.json
          python -c "import json; d=json.load(open('/tmp/csp-result.json')); assert d['decision']['status']=='admitted'; assert len(d['execution']['policy_sha256'])==64"
