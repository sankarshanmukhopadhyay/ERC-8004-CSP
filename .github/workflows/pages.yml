name: Publish complete repository documentation

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build_pages.py'
      - 'tests/test_pages.py'
      - '.github/workflows/pages.yml'
      - '**/*.md'
      - '**/*.json'
      - '**/*.rego'
      - '**/*.yaml'
      - '**/*.yml'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install site renderer
        run: python -m pip install 'Markdown==3.7' 'bleach==6.2.0'
      - name: Build complete site
        run: python scripts/build_pages.py
      - name: Test generated catalogue and internal links
        run: python -m unittest tests/test_pages.py -v
      - name: Upload site for publishing
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
